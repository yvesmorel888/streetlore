<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulateur ROI Apprentissage — Sully Business School</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
    body { margin: 0; background: #f1f5f9; }

    .header-gradient { background: linear-gradient(135deg, #0c1f4d 0%, #1e3799 60%, #0c2461 100%); }
    .impact-gradient  { background: linear-gradient(135deg, #0c2461 0%, #1e3799 50%, #0c2461 100%); }

    input[type=range] {
      -webkit-appearance: none; width: 100%; height: 6px;
      border-radius: 3px; background: #e2e8f0; outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
      background: #1e3799; cursor: pointer;
      box-shadow: 0 2px 8px rgba(30,55,153,0.4); transition: transform 0.15s;
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }
    input[type=range]::-moz-range-thumb {
      width: 22px; height: 22px; border-radius: 50%;
      background: #1e3799; cursor: pointer; border: none;
    }

    input[type=number] {
      -moz-appearance: textfield;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

    .card { background: #fff; border-radius: 16px; border: 1px solid #e8eef5; box-shadow: 0 1px 6px rgba(0,0,0,.06); }

    .badge-age { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }

    .formation-btn {
      border: 2px solid #e2e8f0; border-radius: 14px; background: #fff;
      cursor: pointer; text-align: left; transition: all .18s; padding: 14px 12px;
    }
    .formation-btn:hover { border-color: #93aede; transform: translateY(-1px); }
    .formation-btn.active {
      border-color: #1e3799; background: #1e3799; color: #fff;
      box-shadow: 0 4px 16px rgba(30,55,153,.3);
    }

    .toggle-btn {
      flex: 1; border-radius: 12px; border: none; cursor: pointer;
      font-weight: 600; transition: all .18s; line-height: 1.3;
    }
    .toggle-btn.active  { background: #1e3799; color: #fff; box-shadow: 0 3px 10px rgba(30,55,153,.3); }
    .toggle-btn:not(.active) { background: #f1f5f9; color: #64748b; }
    .toggle-btn:not(.active):hover { background: #e2e8f0; }

    .ref-btn {
      flex: 1; border-radius: 12px; border: 2px solid #e2e8f0; background: #fff;
      cursor: pointer; padding: 10px 8px; text-align: center;
      transition: all .18s; line-height: 1.3;
    }
    .ref-btn:hover { border-color: #93aede; }
    .ref-btn.active {
      border-color: #1e3799; background: #eff6ff; color: #1e3799;
      box-shadow: 0 2px 8px rgba(30,55,153,.15);
    }

    .bar-bg  { height: 12px; border-radius: 6px; background: #e2e8f0; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 6px; transition: width .7s cubic-bezier(.4,0,.2,1); }

    .pulse-soft { animation: softPulse 3s ease-in-out infinite; }
    @keyframes softPulse { 0%,100% { opacity: 1; } 50% { opacity: .88; } }

    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 10px 8px; text-align: left; font-size: 14px; }
    thead th { border-bottom: 2px solid #e8eef5; color: #64748b; font-weight: 500; }
    tbody tr { border-bottom: 1px solid #f1f5f9; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr.hl-blue  { background: #eff6ff; }
    tbody tr.hl-green { background: #f0fdf4; }
    tbody tr.hl-amber { background: #fffbeb; }
    .tr { text-align: right; }
    .mono { font-family: 'SF Mono', 'Fira Mono', monospace; }

    @media print {
      .no-print { display: none !important; }
      body { background: white; }
      .card { box-shadow: none; border: 1px solid #ccc; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

// ── CONSTANTES ──────────────────────────────────────────────────────────────

const SMIC_MONTHLY = 1823.03;

const BASE_H = 1607;
const EXAM_H = 35;

const FORMATIONS = [
  { id: 'titre',   label: 'Titre Pro', level: 'Niveau 4', icon: '📋', hours: 400, sullyFee: 0   },
  { id: 'bts',     label: 'BTS',       level: 'Niveau 5', icon: '📘', hours: 675, sullyFee: 0   },
  { id: 'bachelor',label: 'Bachelor',  level: 'Niveau 6', icon: '🎓', hours: 520, sullyFee: 750 },
  { id: 'mastere', label: 'Mastère',   level: 'Niveau 7', icon: '🏆', hours: 525, sullyFee: 750 },
];

const STATE_AID = {
  small: { titre: 4500, bts: 4500, bachelor: 2000, mastere: 2000 },
  big:   { titre: 1500, bts: 1500, bachelor: 750,  mastere: 750  },
};

// RQTH (contrats à compter du 8 mars 2026)
const RQTH_ETAT    = 6000;
const RQTH_AGEFIPH = 3000;

const REF_SALARIES = [
  { id: 'smic',  label: 'SMIC',              sublabel: 'Opérateur / Employé',    monthly: 1823.03, charges: 0.07 },
  { id: 'tech',  label: 'Bac +2/3 — 2 200 €', sublabel: 'Technicien / Assistant', monthly: 2200,    charges: 0.18 },
  { id: 'cadre', label: 'Bac +5 — 2 400 €',   sublabel: 'Cadre Junior',           monthly: 2400,    charges: 0.24 },
];

const DEFAULT_REF = { titre: 'smic', bts: 'smic', bachelor: 'tech', mastere: 'cadre' };
const DEFAULT_AGE = { titre: 22, bts: 18, bachelor: 20, mastere: 21 };
const DURATION    = { titre: 1,  bts: 2,  bachelor: 1,  mastere: 2  }; // durée du contrat en années

const FC_URL = rncp => `https://www.francecompetences.fr/recherche/rncp/${rncp}/`;

const SPECIFIC_FORMATIONS = {
  titre: [
    { id: 'tad',  label: 'Assistant(e) de Direction',           rncp: 36521, hours: 518 },
    { id: 'tc',   label: 'Comptable',                            rncp: 36522, hours: 518 },
    { id: 'tgp',  label: 'Gestionnaire de paie',                 rncp: 38147, hours: 518 },
  ],
  bts: [
    { id: 'bts-assu', label: 'Assurance',                            rncp: 38359, hours: 675 },
    { id: 'bts-gpme', label: 'Gestion de la PME',                    rncp: 38363, hours: 675 },
    { id: 'bts-gtla', label: 'Gestion des Transports et Logistique', rncp: 38365, hours: 675 },
    { id: 'bts-mco',  label: 'Management Commercial Opérationnel',   rncp: 38362, hours: 675 },
    { id: 'bts-ndrc', label: 'Négociation et Digitalisation RC',     rncp: 38368, hours: 675 },
  ],
  bachelor: [
    { id: 'bba',   label: 'Conseiller clientèle banque & assurance', rncp: 41716, hours: 558 },
    { id: 'bcmrh', label: 'Chargé(e) de missions en RH',             rncp: 40853, hours: 553 },
    { id: 'bcg',   label: 'Contrôleur de Gestion et Comptable',      rncp: 35989, hours: 553 },
    { id: 'bcm',   label: 'Community Manager',                        rncp: 40907, hours: 553 },
    { id: 'brdc',  label: 'Responsable du Développement Commercial',  rncp: 38123, hours: 450 },
    { id: 'brai',  label: 'Responsable d\'affaires en immobilier',    rncp: 40660, hours: 520 },
  ],
  mastere: [
    { id: 'mmcom', label: 'Manager Commercial et Marketing', rncp: 35208, hours: 525 },
    { id: 'mmrh',  label: 'Manager en Ressources Humaines',  rncp: 38460, hours: 525 },
  ],
};

const CHARGES_APP = 0.02;

// ── AIDES ───────────────────────────────────────────────────────────────────

function getAids(fId, yr, bigCompany, rqth) {
  if (yr === 2) return { stateAid: 0, agefiph: 0 };          // Pas d'aide en 2e année
  if (rqth)     return { stateAid: RQTH_ETAT, agefiph: RQTH_AGEFIPH }; // RQTH : aide majorée + Agefiph
  return { stateAid: (bigCompany ? STATE_AID.big : STATE_AID.small)[fId], agefiph: 0 };
}

// ── CALCULS ─────────────────────────────────────────────────────────────────

function getPct(age, yr) {
  if (age >= 26) return 1.00;
  if (age >= 21) return yr === 1 ? 0.53 : 0.61;
  return yr === 1 ? 0.43 : 0.51;
}

function ageLabel(age) {
  if (age >= 26) return { text: '26 ans et +', cls: 'bg-purple-100 text-purple-700' };
  if (age >= 21) return { text: '21 – 25 ans',  cls: 'bg-blue-100 text-blue-700'   };
  return          { text: '18 – 20 ans',  cls: 'bg-emerald-100 text-emerald-700' };
}

function getAgeAt(dob, refDate) {
  const d = new Date(dob), r = new Date(refDate);
  let age = r.getFullYear() - d.getFullYear();
  if (r.getMonth() < d.getMonth() || (r.getMonth() === d.getMonth() && r.getDate() < d.getDate())) age--;
  return age;
}

// Calcule le salaire mensuel moyen pondéré sur une année de contrat,
// en découpant aux anniversaires de 21 et 26 ans.
function computePreciseSalary(dobStr, contractStartStr, yr) {
  const dob = new Date(dobStr);
  const cs  = new Date(contractStartStr);
  const periodStart = new Date(cs.getFullYear() + (yr - 1), cs.getMonth(), cs.getDate());
  const periodEnd   = new Date(cs.getFullYear() + yr,       cs.getMonth(), cs.getDate());
  const turns21 = new Date(dob.getFullYear() + 21, dob.getMonth(), dob.getDate());
  const turns26 = new Date(dob.getFullYear() + 26, dob.getMonth(), dob.getDate());

  const bps = [periodStart.getTime()];
  if (turns21 > periodStart && turns21 < periodEnd) bps.push(turns21.getTime());
  if (turns26 > periodStart && turns26 < periodEnd) bps.push(turns26.getTime());
  bps.push(periodEnd.getTime());

  const totalDays = (periodEnd - periodStart) / 86400000;
  let weightedPct = 0;
  const segments = [];
  for (let i = 0; i < bps.length - 1; i++) {
    const s = new Date(bps[i]), e = new Date(bps[i + 1]);
    const days     = Math.round((bps[i + 1] - bps[i]) / 86400000);
    const fraction = days / totalDays;
    const age      = getAgeAt(dob, s);
    const pct      = getPct(age, yr);
    weightedPct   += fraction * pct;
    segments.push({ start: s, end: e, age, pct, days, fraction });
  }
  return { weightedPct, segments, monthlyAvg: SMIC_MONTHLY * weightedPct };
}

function computeSingle(fId, age, yr, bigCompany, refSal, rqth, extraRac, specificHours, preciseMonthly) {
  const f = FORMATIONS.find(x => x.id === fId);
  const { stateAid, agefiph } = getAids(fId, yr, bigCompany, rqth);
  const hours = specificHours ?? f.hours;

  const realH      = BASE_H - (hours + EXAM_H);
  const appMonthly = preciseMonthly != null ? preciseMonthly : SMIC_MONTHLY * getPct(age, yr);
  const pct        = appMonthly / SMIC_MONTHLY;
  const appAnnual  = appMonthly * 12;
  const appCost    = appAnnual * (1 + CHARGES_APP) + f.sullyFee - stateAid - agefiph + extraRac;
  const hourlyReal = appCost / realH;

  const etpMonthly = ((hourlyReal * BASE_H) / (1 + refSal.charges)) / 12;

  const refAnnual       = refSal.monthly * 12;
  const refCost         = refAnnual * (1 + refSal.charges);
  const refHourly       = refCost / BASE_H;
  const hourlySaving    = refHourly - hourlyReal;
  const hourlySavingPct = (hourlySaving / refHourly) * 100;
  const etpRatio        = (etpMonthly / refSal.monthly) * 100;

  return {
    f, stateAid, agefiph, extraRac, realH, pct, appMonthly, appAnnual, appCost,
    hourlyReal, etpMonthly, etpRatio,
    refAnnual, refCost, refHourly,
    hourlySaving, hourlySavingPct,
    presencePct: (realH / BASE_H) * 100,
    isAvg: false,
  };
}

function compute(fId, age, yr, bigCompany, refSal, rqth, extraRac, specificHours, pm1, pm2) {
  if (yr !== 'avg') {
    const pm = yr === 1 ? pm1 : yr === 2 ? pm2 : null;
    return computeSingle(fId, age, yr, bigCompany, refSal, rqth, extraRac, specificHours, pm);
  }
  const r1 = computeSingle(fId, age, 1, bigCompany, refSal, rqth, extraRac, specificHours, pm1);
  const r2 = computeSingle(fId, age, 2, bigCompany, refSal, rqth, extraRac, specificHours, pm2);
  const avg = k => (r1[k] + r2[k]) / 2;
  const appCost        = avg('appCost');
  const hourlyReal     = appCost / r1.realH;
  const etpMonthly     = ((hourlyReal * BASE_H) / (1 + refSal.charges)) / 12;
  const refAnnual      = r1.refAnnual;
  const refCost        = r1.refCost;
  const refHourly      = r1.refHourly;
  const hourlySaving    = refHourly - hourlyReal;
  const hourlySavingPct = (hourlySaving / refHourly) * 100;
  const etpRatio       = (etpMonthly / refSal.monthly) * 100;
  return {
    f: r1.f, isAvg: true,
    stateAid: avg('stateAid'), agefiph: avg('agefiph'), extraRac,
    realH: r1.realH, pct: avg('pct'),
    appMonthly: avg('appMonthly'), appAnnual: avg('appAnnual'),
    appCost, hourlyReal, etpMonthly, etpRatio,
    refAnnual, refCost, refHourly, hourlySaving, hourlySavingPct,
    presencePct: r1.presencePct,
  };
}

// ── FORMATTERS ──────────────────────────────────────────────────────────────

const fr2    = n => new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
const fr0    = n => new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 }).format(n);
const frN    = n => fr0(Math.round(n));
const eur    = n => `${fr2(n)} €`;
const eur0   = n => `${fr0(n)} €`;
const frDate = d => new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });

// ── COMPOSANTS ──────────────────────────────────────────────────────────────

function StepLabel({ n, text, badge }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '14px' }}>
      <span style={{ width: '22px', height: '22px', borderRadius: '50%', background: '#eff6ff', color: '#1e3799', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '12px', fontWeight: 800, flexShrink: 0 }}>{n}</span>
      <span style={{ fontSize: '12px', fontWeight: 700, color: '#475569', textTransform: 'uppercase', letterSpacing: '.06em' }}>{text}</span>
      {badge && <span style={{ fontSize: '10px', fontWeight: 700, padding: '2px 7px', borderRadius: '20px', background: '#fef3c7', color: '#92400e' }}>{badge}</span>}
    </div>
  );
}

function FormationPicker({ value, onChange, bigCompany }) {
  const [open, setOpen] = useState(false);
  const aidMap = bigCompany ? STATE_AID.big : STATE_AID.small;
  const sel = FORMATIONS.find(f => f.id === value);
  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: '12px', padding: '12px 14px', borderRadius: '12px', border: '2px solid #1e3799', background: '#eff6ff' }}>
        <span style={{ fontSize: '22px' }}>{sel.icon}</span>
        <div style={{ flex: 1 }}>
          <div style={{ fontWeight: 700, fontSize: '15px', color: '#1e3799' }}>{sel.label}</div>
          <div style={{ fontSize: '11px', color: '#6080c4', marginTop: '2px' }}>
            {sel.level} · {frN(sel.hours)} h école/an · Aide État {eur0(aidMap[sel.id])}
            {sel.sullyFee > 0 ? ` · RAC +${eur0(sel.sullyFee)}` : ' · RAC inclus'}
          </div>
        </div>
        <button className="no-print" onClick={() => setOpen(o => !o)}
          style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#1e3799', fontWeight: 700, fontSize: '12px', padding: '4px 8px', flexShrink: 0 }}>
          {open ? '▲ Fermer' : '✏️ Modifier'}
        </button>
      </div>
      {open && (
        <div className="no-print" style={{ marginTop: '10px', display: 'grid', gridTemplateColumns: 'repeat(2,1fr)', gap: '10px' }}>
          {FORMATIONS.map(f => (
            <button key={f.id} className={`formation-btn ${value === f.id ? 'active' : ''}`}
              onClick={() => { onChange(f.id); setOpen(false); }}>
              <div style={{ fontSize: '22px', marginBottom: '4px' }}>{f.icon}</div>
              <div style={{ fontWeight: 700, fontSize: '16px' }}>{f.label}</div>
              <div style={{ fontSize: '11px', opacity: .7, marginTop: '2px' }}>{f.level}</div>
              <div style={{ fontSize: '11px', marginTop: '6px', opacity: .8 }}>{frN(f.hours)} h école/an</div>
              <div style={{ fontSize: '11px', marginTop: '3px', color: value === f.id ? '#86efac' : '#059669', fontWeight: 600 }}>
                Aide État {eur0(aidMap[f.id])}
              </div>
              {f.sullyFee > 0
                ? <div style={{ fontSize: '11px', color: value === f.id ? '#fcd34d' : '#d97706' }}>RAC +{eur0(f.sullyFee)}</div>
                : <div style={{ fontSize: '11px', color: value === f.id ? '#86efac' : '#059669' }}>RAC inclus</div>}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function SizePicker({ value, onChange }) {
  return (
    <div style={{ display: 'flex', gap: '10px' }}>
      {[false, true].map(big => (
        <button key={String(big)} className={`toggle-btn ${value === big ? 'active' : ''}`}
          style={{ padding: '11px 8px', fontSize: '13px' }} onClick={() => onChange(big)}>
          {big ? '≥ 250 salariés' : '< 250 salariés'}
        </button>
      ))}
    </div>
  );
}

function AgePicker({ value, onChange }) {
  const lbl = ageLabel(value);
  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '12px' }}>
        <span style={{ fontSize: '28px', fontWeight: 800, color: '#0f172a' }}>{value} ans</span>
        <span className={`badge-age ${lbl.cls}`}>{lbl.text}</span>
      </div>
      <input type="range" min={18} max={30} value={value} onChange={e => onChange(+e.target.value)} />
      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '11px', color: '#94a3b8', marginTop: '6px' }}>
        <span>18</span><span>21</span><span>26</span><span>30</span>
      </div>
    </div>
  );
}

function YearPicker({ value, onChange, duration }) {
  if (duration === 1) {
    return (
      <div style={{ padding: '8px 12px', background: '#f8fafc', borderRadius: '10px', fontSize: '13px', color: '#64748b', fontWeight: 600, display: 'inline-block' }}>
        📅 Contrat 1 an
      </div>
    );
  }
  const options = [
    { val: 1,     label: '1re Année'  },
    { val: 2,     label: '2e Année'   },
    { val: 'avg', label: 'Moy. 2 ans' },
  ];
  return (
    <div style={{ display: 'flex', gap: '8px' }}>
      {options.map(opt => (
        <button key={opt.val} className={`toggle-btn ${value === opt.val ? 'active' : ''}`}
          style={{ padding: '11px 8px', fontSize: '13px' }} onClick={() => onChange(opt.val)}>
          {opt.label}
        </button>
      ))}
    </div>
  );
}

function RQTHToggle({ value, onChange }) {
  return (
    <div>
      <div style={{ display: 'flex', gap: '10px' }}>
        <button className={`toggle-btn ${!value ? 'active' : ''}`}
          style={{ padding: '11px 8px', fontSize: '13px' }} onClick={() => onChange(false)}>
          Standard
        </button>
        <button
          style={{
            flex: 1, padding: '11px 8px', fontSize: '13px', borderRadius: '12px',
            border: 'none', cursor: 'pointer', fontWeight: 600, transition: 'all .18s',
            background: value ? '#d97706' : '#f1f5f9',
            color: value ? '#fff' : '#64748b',
            boxShadow: value ? '0 3px 10px rgba(217,119,6,.3)' : 'none',
          }}
          onClick={() => onChange(true)}>
          ♿ RQTH
        </button>
      </div>
      {value && (
        <div style={{ marginTop: '10px', padding: '10px 12px', background: '#fffbeb', border: '1px solid #fde68a', borderRadius: '10px', fontSize: '12px', color: '#92400e', lineHeight: 1.7 }}>
          <strong>1re année :</strong> Aide État <strong>{eur0(RQTH_ETAT)}</strong> + Agefiph <strong>{eur0(RQTH_AGEFIPH)}</strong> = <strong>{eur0(RQTH_ETAT + RQTH_AGEFIPH)}</strong> cumulables<br/>
          <strong>2e année :</strong> Aucune aide (règle commune)<br/>
          <span style={{ color: '#b45309', fontSize: '11px' }}>Quelle que soit la taille de l'entreprise et le niveau de diplôme</span>
        </div>
      )}
    </div>
  );
}

function ExtraRACInput({ value, onChange }) {
  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
        <input
          type="number" min={0} step={50} value={value || ''}
          placeholder="0"
          onChange={e => onChange(Math.max(0, parseInt(e.target.value) || 0))}
          style={{
            flex: 1, padding: '10px 14px', border: '2px solid #e2e8f0', borderRadius: '10px',
            fontSize: '16px', fontWeight: 700, textAlign: 'right', outline: 'none',
            color: '#1e293b', transition: 'border-color .15s',
          }}
          onFocus={e => e.target.style.borderColor = '#1e3799'}
          onBlur={e => e.target.style.borderColor = '#e2e8f0'}
        />
        <span style={{ fontWeight: 700, color: '#475569', fontSize: '15px', flexShrink: 0 }}>€ / an</span>
      </div>
      <div style={{ fontSize: '12px', color: '#94a3b8', marginTop: '6px' }}>
        Équipements, tutorat, frais annexes…
      </div>
    </div>
  );
}

function RefSalaryToggle({ value, onChange, defaultId }) {
  return (

  const specificHours = specificFm ? specificFm.hours : null;

  const preciseYr1 = useMemo(
    () => useDateMode && dob && contractStart ? computePreciseSalary(dob, contractStart, 1) : null,
    [useDateMode, dob, contractStart]
  );
  const preciseYr2 = useMemo(
    () => useDateMode && dob && contractStart && DURATION[formation] === 2 ? computePreciseSalary(dob, contractStart, 2) : null,
    [useDateMode, dob, contractStart, formation]
  );

  const pm1 = preciseYr1 ? preciseYr1.monthlyAvg : null;
  const pm2 = preciseYr2 ? preciseYr2.monthlyAvg : null;

  const r = useMemo(
    () => compute(formation, age, yr, bigCompany, refSal, rqth, extraRac, specificHours, pm1, pm2),
    [formation, age, yr, bigCompany, refSal, rqth, extraRac, specificHours, pm1, pm2]
  );

  const currentPreciseData = useDateMode
    ? (yr === 1 ? preciseYr1 : yr === 2 ? preciseYr2 : null)
    : null;

  return (
    <div style={{ minHeight: '100vh', background: '#f1f5f9' }}>

      <header className="header-gradient" style={{ padding: '28px 20px 24px', color: '#fff' }}>
        <div style={{ maxWidth: '960px', margin: '0 auto' }}>
          <div style={{ fontSize: '11px', fontWeight: 700, color: '#93c5fd', textTransform: 'uppercase', letterSpacing: '.12em', marginBottom: '4px' }}>
            Sully Business School
          </div>
          <h1 style={{ margin: 0, fontSize: '26px', fontWeight: 800, lineHeight: 1.2 }}>Simulateur ROI Apprentissage</h1>
          <p style={{ margin: '6px 0 0', fontSize: '14px', color: '#bfdbfe' }}>Démonstration financière de la valeur de l'alternance · Référentiel 2026/2027</p>
        </div>
      </header>

      <main style={{ maxWidth: '960px', margin: '0 auto', padding: '24px 16px 40px' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '340px 1fr', gap: '20px', alignItems: 'start' }}>

          {/* COLONNE GAUCHE */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>

            <div className="card" style={{ padding: '20px' }}>
              <StepLabel n="1" text="Formation" />
              <FormationPicker value={formation} onChange={handleFormationChange} bigCompany={bigCompany} />
              {(SPECIFIC_FORMATIONS[formation] || []).length > 0 && (
                <div style={{ marginTop: '16px', paddingTop: '16px', borderTop: '1px solid #e8eef5' }}>
                  <div style={{ fontSize: '11px', fontWeight: 700, color: '#64748b', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: '10px' }}>
                    Spécialité Sully <span style={{ fontWeight: 400, color: '#94a3b8', textTransform: 'none', letterSpacing: 0 }}>(optionnel — affine les heures)</span>
                  </div>
                  <SpecificFormationPicker fId={formation} value={specificId} onChange={setSpecificId} />
                </div>
              )}
            </div>

            <div className="card" style={{ padding: '20px' }}>
              <StepLabel n="2" text="Taille de l'entreprise" />
              <SizePicker value={bigCompany} onChange={setBigCompany} />
              <div style={{ marginTop: '10px', fontSize: '12px', color: '#94a3b8', lineHeight: 1.5 }}>
                {bigCompany ? 'Aide de l\'État réduite pour les entreprises ≥ 250 salariés.' : 'Aide de l\'État pleine pour les entreprises < 250 salariés.'}
              </div>
            </div>

            <div className="card" style={{ padding: '20px' }}>
              <StepLabel n="3" text="Rémunération de l'apprenti" />
              <div style={{ display: 'flex', gap: '8px', marginBottom: '16px' }}>
                <button className={`toggle-btn ${!useDateMode ? 'active' : ''}`}
                  style={{ padding: '9px 8px', fontSize: '12px' }} onClick={() => setUseDateMode(false)}>
                  Âge approx.
                </button>
                <button className={`toggle-btn ${useDateMode ? 'active' : ''}`}
                  style={{ padding: '9px 8px', fontSize: '12px' }} onClick={() => setUseDateMode(true)}>
                  📅 Dates précises
                </button>
              </div>
              {!useDateMode ? (
                <AgePicker value={age} onChange={setAge} />
              ) : (
                <div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '12px' }}>
                    {[['Date de naissance', dob, setDob], ['Début de contrat', contractStart, setContractStart]].map(([lbl, val, set]) => (
                      <label key={lbl} style={{ display: 'flex', flexDirection: 'column', gap: '4px' }}>
                        <span style={{ fontSize: '11px', fontWeight: 600, color: '#64748b' }}>{lbl}</span>
                        <input type="date" value={val} onChange={e => set(e.target.value)}
                          style={{ padding: '8px 10px', border: '2px solid #e2e8f0', borderRadius: '10px', fontSize: '13px', outline: 'none', width: '100%', boxSizing: 'border-box' }}
                          onFocus={e => e.target.style.borderColor = '#1e3799'}
                          onBlur={e => e.target.style.borderColor = '#e2e8f0'} />
                      </label>
                    ))}
                  </div>
                  {preciseYr1 ? (
                    <div>
                      <SalaryYearDetail label="1re Année" data={preciseYr1} />
                      {DURATION[formation] === 2 && preciseYr2 && (
                        <SalaryYearDetail label="2e Année" data={preciseYr2} />
                      )}
                    </div>
                  ) : (
                    <div style={{ fontSize: '12px', color: '#94a3b8', textAlign: 'center', padding: '8px 0', fontStyle: 'italic' }}>
                      Entrez les deux dates pour afficher le calcul précis
                    </div>
                  )}
                </div>
              )}
            </div>

            <div className="card" style={{ padding: '20px' }}>
              <StepLabel n="4" text="Année de Contrat" />
              <YearPicker value={yr} onChange={setYr} duration={DURATION[formation]} />
            </div>

            <div className="card" style={{ padding: '20px' }}>
              <StepLabel n="5" text="Statut de l'Apprenti" badge={rqth ? 'RQTH' : null} />
              <RQTHToggle value={rqth} onChange={setRqth} />
            </div>

            <div className="card" style={{ padding: '20px' }}>
              <StepLabel n="6" text="RAC supplémentaire" />
              <ExtraRACInput value={extraRac} onChange={setExtraRac} />
            </div>

            {/* Récapitulatif */}
            <div style={{ background: rqth ? '#78350f' : '#1e3799', borderRadius: '16px', padding: '18px', color: '#fff', transition: 'background .3s' }}>
              <div style={{ fontSize: '11px', fontWeight: 700, color: rqth ? '#fde68a' : '#93c5fd', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: '12px' }}>
                Paramètres Actuels
              </div>
              {[
                ['Formation',          r.f.label],
                ...(specificFm ? [['Spécialité', specificFm.label]] : []),
                ...(DURATION[formation] === 2 ? [['Année', yr === 1 ? '1re' : yr === 2 ? '2e' : 'Moy. 2 ans']] : []),
                ['Entreprise',         bigCompany ? '≥ 250 salariés' : '< 250 salariés'],
                ['Statut',             rqth ? '♿ RQTH' : 'Standard'],
                ['Grille salariale',   `${Math.round(r.pct * 100)} % du SMIC`],
                ['Salaire brut/mois',  eur(r.appMonthly)],
                ['Aide de l\'État',    r.stateAid > 0 ? `${eur0(r.stateAid)}${yr === 'avg' ? ' moy.' : ''}` : '— (an 2)'],
                ...(rqth && (yr === 1 || yr === 'avg') ? [['Aide Agefiph', `${eur0(r.agefiph)}${yr === 'avg' ? ' moy.' : ''}`]] : []),
                ...(extraRac > 0     ? [['RAC suppl.',   eur0(extraRac)]] : []),
                ['Référence comparée', eur0(refSal.monthly) + '/mois'],
                ['Heures présence',    `${frN(r.realH)} h / an`],
                ['Coût horaire réel',  `${eur(r.hourlyReal)} / h`],
              ].map(([k, v]) => (
                <div key={k} style={{ display: 'flex', justifyContent: 'space-between', fontSize: '13px', marginBottom: '6px' }}>
                  <span style={{ color: rqth ? '#fde68a' : '#93c5fd', opacity: .85 }}>{k}</span>
                  <span style={{ fontWeight: 700, color: k === 'Salaire brut/mois' ? '#fde047' : '#fff' }}>{v}</span>
                </div>
              ))}
            </div>

          </div>

          {/* COLONNE DROITE */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
            <PresenceBar r={r} />
            <RefSalaryToggle value={refSalId} onChange={setRefSalId} defaultId={defaultRefId} />
            <ComparisonTable r={r} refSal={refSal} rqth={rqth} yr={yr} preciseData={currentPreciseData} />
            <EconomyCards r={r} />
            <CostBars r={r} refSal={refSal} />
            <ImpactMessage r={r} refSal={refSal} rqth={rqth} />

            <div className="no-print" style={{ display: 'flex', justifyContent: 'flex-end' }}>
              <button onClick={() => window.print()}
                style={{ padding: '9px 18px', borderRadius: '10px', border: '1px solid #e2e8f0', background: '#fff', color: '#475569', fontSize: '13px', fontWeight: 600, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '6px' }}>
                🖨️ Imprimer / Exporter PDF
              </button>
            </div>
          </div>

        </div>
      </main>

      <footer style={{ textAlign: 'center', padding: '16px', fontSize: '12px', color: '#94a3b8', borderTop: '1px solid #e2e8f0', background: '#fff' }}>
        <strong>Sully Business School</strong> · Simulateur ROI Apprentissage 2026/2027 ·
        Base légale {frN(BASE_H)} h/an · Données indicatives, hors cas particuliers
      </footer>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
